<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🪷 Mindful+ — Chat & Voice</title>
<style>
  :root{--bg:#f4f9f9;--card:#fff;--text:#102a43;--muted:#6b7280;--accent:#2aa198;--grad:linear-gradient(135deg,#87ceeb,#2aa198);--border:rgba(127,140,141,0.20)}
  [data-theme="dark"]{--bg:#0e1419;--card:#111a21;--text:#dbe2e7;--muted:#9aa7b0;--accent:#35c2b8;--grad:linear-gradient(135deg,#1e293b,#0ea5a5);--border:rgba(127,140,141,0.28)}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px}
  .container{max-width:900px;margin:auto}
  header{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:18px;padding:16px 20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,0.12)}
  .brand{font-weight:800;font-size:1.6rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .right{display:flex;gap:10px;align-items:center}
  .pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(127,140,141,0.12);color:var(--muted);font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:#ef4444}
  .dot.connecting{background:#f59e0b;animation:pulse 1.2s infinite}
  .dot.connected{background:#10b981;animation:pulse 2s infinite}
  section.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,0.12)}
  .chat{height:520px;overflow:auto;background:rgba(127,140,141,0.08);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative}
  .msg{margin:8px 0;display:flex;flex-direction:column}
  .bubble{padding:10px 14px;border-radius:16px;max-width:78%;line-height:1.5}
  .msg.user{align-items:flex-end}
  .msg.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
  .msg.assistant .bubble{background:rgba(127,140,141,0.18);color:var(--text);border-bottom-left-radius:6px}
  .timestamp{font-size:.72rem;color:var(--muted);margin-top:4px}
  .chat-input{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px;align-items:center}
  textarea{border:2px solid var(--border);background:transparent;color:var(--text);border-radius:12px;padding:12px;resize:none;font:inherit;min-height:44px}
  .send{padding:12px 16px;border:none;border-radius:12px;background:var(--grad);color:#fff;cursor:pointer;font-weight:700}
  .mic{position:relative;width:48px;height:48px;background:rgba(127,140,141,0.15);color:var(--text);display:grid;place-items:center;border:none;border-radius:12px;cursor:pointer}
  .mic.active{color:#b91c1c;background:rgba(239,68,68,0.12)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body>
<div class="container" id="root">
  <header>
    <div class="brand">🪷 Mindful+</div>
    <div class="right">
      <button id="theme" class="btn">🌓</button>
      <div class="pill"><span id="dot" class="dot"></span><span id="stat">Disconnected</span></div>
    </div>
  </header>
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Chat & Voice</h3><small id="mode" style="color:var(--muted)"></small>
    </div>
    <div id="chat" class="chat">
      <div class="msg assistant"><div class="bubble">Welcome to Mindful+. How are you feeling today?</div><div class="timestamp"></div></div>
    </div>
    <div class="chat-input">
      <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
      <button id="send" class="send">➤</button>
      <button id="mic" class="mic"><span class="mic-ring"></span>🎙️</button>
    </div>
  </section>
</div>

<script>
const root=document.getElementById('root');
const themeBtn=document.getElementById('theme');
if(localStorage.getItem('mindful_theme')==='dark')root.setAttribute('data-theme','dark');
themeBtn.onclick=()=>{const dark=root.getAttribute('data-theme')==='dark';if(dark)root.removeAttribute('data-theme');else root.setAttribute('data-theme','dark');localStorage.setItem('mindful_theme',dark?'light':'dark');};

const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),
micBtn=document.getElementById('mic'),dot=document.getElementById('dot'),stat=document.getElementById('stat'),mode=document.getElementById('mode');
const CONFIG={API_BASE:window.location.origin,WS_BASE:(location.protocol==='https:'?'wss://':'ws://')+location.host};
let ws=null,ac=null,micStream=null,srcNode=null,proc=null,recording=false;

function now(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'assistant');const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);const ts=document.createElement('div');ts.className='timestamp';ts.textContent=now();d.appendChild(ts);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

sendBtn.onclick=doSend;
input.addEventListener('keypress',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
async function doSend(){const msg=input.value.trim();if(!msg)return;addMsg('user',msg);input.value='';try{const r=await fetch(CONFIG.API_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})});const data=await r.json();addMsg('assistant',data.response);}catch{addMsg('sys','Network error.');}}

micBtn.onclick=()=>recording?stopVoice():startVoice();

async function startVoice(){
  try{
    micBtn.classList.add('active');mode.textContent='Voice mode';setStatus('connecting','Connecting...');
    const sid='session_'+Date.now().toString(36);
    ws=new WebSocket(`${CONFIG.WS_BASE}/ws/voice/${sid}`);
    ws.onopen=async()=>{
      setStatus('connected','Listening...');ws.send(JSON.stringify({type:'start_session'}));
      ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
      micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,sampleRate:16000,sampleSize:16,echoCancellation:true,noiseSuppression:true}});
      srcNode=ac.createMediaStreamSource(micStream);proc=ac.createScriptProcessor(8192,1,1);
      srcNode.connect(proc);proc.connect(ac.destination);
      proc.onaudioprocess=e=>{
        const input=e.inputBuffer.getChannelData(0);let rms=0;for(let i=0;i<input.length;i++)rms+=input[i]*input[i];
        rms=Math.sqrt(rms/input.length);if(rms<0.01)return;
        const pcm16=new Int16Array(input.length);for(let i=0;i<input.length;i++){const s=Math.max(-1,Math.min(1,input[i]));pcm16[i]=s<0?s*0x8000:s*0x7fff;}
        const bytes=new Uint8Array(pcm16.buffer);let bin='';const chunk=0x8000;
        for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
        if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'audio
