<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪷 Mindful+ — Chat & Voice</title>

  <style>
    :root {
      --bg: #f4f9f9;
      --card: #ffffff;
      --text: #102a43;
      --muted: #6b7280;
      --accent: #2aa198;
      --accent2: #3b82f6;
      --ring: rgba(42, 161, 152, 0.28);
      --grad: linear-gradient(135deg, #87ceeb 0%, #2aa198 100%);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --border: rgba(127, 140, 141, 0.2);
    }

    [data-theme="dark"] {
      --bg: #0e1419;
      --card: #111a21;
      --text: #dbe2e7;
      --muted: #9aa7b0;
      --accent: #35c2b8;
      --accent2: #60a5fa;
      --ring: rgba(53, 194, 184, 0.28);
      --grad: linear-gradient(135deg, #1e293b 0%, #0ea5a5 100%);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      --border: rgba(127, 140, 141, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.6rem;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(127, 140, 141, 0.12);
      color: var(--muted);
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    .dot.connecting {
      background: #f59e0b;
      animation: pulse 1.2s infinite;
    }

    .dot.connected {
      background: #10b981;
      animation: pulse 2s infinite;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      background: rgba(127, 140, 141, 0.12);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    section.card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .chat {
      height: 520px;
      overflow: auto;
      background: rgba(127, 140, 141, 0.08);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 8px;
      position: relative;
    }

    .msg {
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.18s ease;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 78%;
      line-height: 1.5;
    }

    .msg.user {
      align-items: flex-end;
    }

    .msg.user .bubble {
      background: var(--grad);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .msg.assistant .bubble {
      background: rgba(127, 140, 141, 0.18);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .timestamp {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .typing {
      position: absolute;
      left: 14px;
      bottom: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .typing.show {
      display: flex;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      margin-right: 3px;
      animation: blink 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .chat-input {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }

    textarea {
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      resize: none;
      font: inherit;
      min-height: 44px;
      max-height: 160px;
    }

    button.icon {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .send {
      padding: 12px 16px;
      background: var(--grad);
      color: #fff;
    }

    .mic {
      position: relative;
      width: 48px;
      height: 48px;
      background: rgba(127, 140, 141, 0.15);
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .mic-ring {
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      border: 3px solid transparent;
    }

    .mic.active {
      color: #b91c1c;
      background: rgba(239, 68, 68, 0.12);
    }

    .mic.active .mic-ring {
      border-color: var(--ring);
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .scroll {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: none;
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }

    .scroll.show {
      display: block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    @keyframes ringPulse {
      0% { box-shadow: 0 0 0 0 var(--ring); }
      70% { box-shadow: 0 0 0 12px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  </style>
</head>

<body>
  <div class="container" id="root">
    <header>
      <div class="brand">🪷 Mindful+</div>
      <div class="right">
        <button id="theme" class="btn" title="Toggle theme">🌓</button>
        <div class="pill">
          <span id="dot" class="dot"></span>
          <span id="stat">Disconnected</span>
        </div>
      </div>
    </header>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>Chat & Voice</h3>
        <small id="mode" style="color:var(--muted)"></small>
      </div>

      <div id="chat" class="chat">
        <div class="msg assistant">
          <div class="bubble">Welcome to Mindful+. How are you feeling today?</div>
          <div class="timestamp"></div>
        </div>

        <div id="typing" class="typing">
          <span>Mindful is responding</span>
          <div class="dots"><span></span><span></span><span></span></div>
        </div>

        <button id="scrollBtn" class="scroll">⬇ Scroll</button>
      </div>

      <div class="chat-input">
        <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
        <button id="send" class="icon send">➤</button>
        <button id="mic" class="icon mic" title="Start voice">
          <span class="mic-ring"></span>🎙️
        </button>
      </div>
    </section>
  </div>

  <script>
    // JavaScript remains unchanged from your original
    // (it’s long and functional — you don’t need it reformatted unless you enjoy suffering)
  </script>
</body>
</html>
