<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪷 Mindful - Chat & Voice</title>
  <style>
    :root {
      --primary:#667eea;--secondary:#764ba2;
      --bg-gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      --shadow-lg:0 10px 40px rgba(0,0,0,0.2);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg-gradient);
      min-height:100vh;padding:20px;}
    .container{max-width:900px;margin:0 auto;}
    header{background:white;border-radius:18px;padding:24px;margin-bottom:24px;
      box-shadow:var(--shadow-lg);display:flex;justify-content:space-between;
      align-items:center;}
    .title{font-size:2rem;background:var(--bg-gradient);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      display:flex;align-items:center;gap:10px;}
    .status{display:flex;align-items:center;gap:10px;background:#f9fafb;
      padding:10px 16px;border-radius:999px;}
    .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;}
    .dot.connected{background:#10b981;animation:pulse 2s infinite;}
    .dot.connecting{background:#f59e0b;animation:pulse 1.2s infinite;}
    section{background:white;border-radius:18px;padding:24px;
      box-shadow:var(--shadow-lg);}
    .chat{height:500px;overflow:auto;background:#f9fafb;border-radius:14px;
      padding:16px;margin-top:12px;}
    .msg{margin-bottom:10px;}
    .msg .b{display:inline-block;padding:10px 14px;border-radius:18px;
      max-width:76%;line-height:1.5;}
    .u .b{background:var(--bg-gradient);color:#fff;border-bottom-right-radius:6px;
      float:right;clear:both;}
    .a .b{background:#e5e7eb;color:#111;border-bottom-left-radius:6px;
      float:left;clear:both;}
    .sys .b{width:100%;text-align:center;background:#fef3c7;color:#92400e;}
    textarea{flex:1;border:2px solid #e5e7eb;border-radius:12px;padding:12px;
      resize:none;font:inherit;}
    .chat-input{display:flex;gap:10px;margin-top:12px;}
    button{border:none;border-radius:12px;font-weight:600;cursor:pointer;}
    .send{padding:12px 16px;background:var(--bg-gradient);color:#fff;}
    .voice{padding:12px 16px;background:#e5e7eb;color:#333;width:64px;}
    .voice.active{background:#fee2e2;color:#b91c1c;}
    .meter{height:60px;background:#f9fafb;border-radius:12px;margin-top:10px;
      display:flex;align-items:center;justify-content:center;}
    canvas{width:100%;height:60px;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">🪷 <span>Mindful</span></div>
      <div class="status"><span id="dot" class="dot"></span>
        <span id="stat">Disconnected</span></div>
    </header>

    <section>
      <h3>💬 Chat + 🎙️ Voice</h3>

      <div id="chat" class="chat">
        <div class="msg a"><div class="b">
          Welcome to Mindful 🪷 How are you feeling today?
        </div></div>
      </div>

      <div class="chat-input">
        <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
        <button id="send" class="send">➤</button>
        <button id="voice" class="voice">🎙️</button>
      </div>

      <div class="meter"><canvas id="viz" width="600" height="60"></canvas></div>
    </section>
  </div>

  <script>
  const CONFIG = {
    API_BASE: window.location.origin,
    WS_BASE: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host,
    MAX_LEN: 1000
  };

  const chat = document.getElementById('chat'),
        input = document.getElementById('input'),
        sendBtn = document.getElementById('send'),
        voiceBtn = document.getElementById('voice'),
        dot = document.getElementById('dot'),
        stat = document.getElementById('stat'),
        canvas = document.getElementById('viz'),
        ctx = canvas.getContext('2d');

  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'u' : role === 'assistant' ? 'a' : 'sys');
    const b = document.createElement('div');
    b.className = 'b';
    b.textContent = text;
    d.appendChild(b);
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  const setStatus = (cls, text) => {
    dot.className = 'dot ' + cls;
    stat.textContent = text;
  };

  input.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      doSend();
    }
  });
  sendBtn.onclick = doSend;

  async function doSend() {
    const msg = input.value.trim();
    if (!msg) return;
    if (msg.length > CONFIG.MAX_LEN) {
      addMsg('sys', 'Message too long.');
      return;
    }
    addMsg('user', msg);
    input.value = '';
    try {
      const res = await fetch(CONFIG.API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: msg, context: '' })
      });
      const data = await res.json();
      if (data.success) addMsg('assistant', data.response);
      else addMsg('sys', 'Failed to get response.');
    } catch (err) {
      addMsg('sys', 'Network error.');
    }
  }

  let ac = null, micStream = null, srcNode = null, proc = null, analyser = null, dataArray = null, ws = null, recording = false;
  let sessionId = 'session_' + Date.now().toString(36);

  function drawViz() {
    if (!analyser) return;
    requestAnimationFrame(drawViz);
    analyser.getByteTimeDomainData(dataArray);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    for (let i = 0; i < dataArray.length; i++) {
      const x = i / dataArray.length * canvas.width;
      const v = dataArray[i] / 128.0;
      const y = v * canvas.height / 2;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#667eea';
    ctx.stroke();
  }

  voiceBtn.onclick = () => (recording ? stopVoice() : startVoice());

  async function startVoice() {
    try {
      voiceBtn.classList.add('active');
      voiceBtn.textContent = '⏹';
      setStatus('connecting', 'Connecting...');
      ws = new WebSocket(`${CONFIG.WS_BASE}/ws/voice/${sessionId}`);

      ws.onopen = async () => {
        setStatus('connected', 'Listening...');
        ws.send(JSON.stringify({ type: 'start_session' }));

        // Use browser's native sample rate (fixes AudioContext mismatch)
        ac = new (window.AudioContext || window.webkitAudioContext)();
        console.log("AudioContext sampleRate:", ac.sampleRate);

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        srcNode = ac.createMediaStreamSource(micStream);
        analyser = ac.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        srcNode.connect(analyser);
        drawViz();

        proc = ac.createScriptProcessor(8192, 1, 1);
        srcNode.connect(proc);
        proc.connect(ac.destination);

        proc.onaudioprocess = e => {
          const input = e.inputBuffer.getChannelData(0);
          let rms = 0;
          for (let i = 0; i < input.length; i++) rms += input[i] * input[i];
          rms = Math.sqrt(rms / input.length);
          if (rms < 0.01) return;

          const pcm16 = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
            const s = Math.max(-1, Math.min(1, input[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }
          const bytes = new Uint8Array(pcm16.buffer);
          let binary = '';
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk)
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          ws.send(JSON.stringify({ type: 'audio_data', data: btoa(binary) }));
        };

        recording = true;
      };

      ws.onmessage = ev => {
        const data = JSON.parse(ev.data);
        if (data.type === 'transcript') addMsg('assistant', '🔊 ' + data.text);
        if (data.type === 'audio_response') playPCM16Hex(data.data);
        if (data.type === 'error') addMsg('sys', 'Voice error: ' + data.message);
        if (data.type === 'session_closed') setStatus('', 'Disconnected');
      };

      ws.onclose = () => setStatus('', 'Disconnected');
    } catch (err) {
      addMsg('sys', 'Mic/WebSocket error: ' + err.message);
      cleanupAudio();
      voiceBtn.classList.remove('active');
      voiceBtn.textContent = '🎙️';
      setStatus('', 'Disconnected');
    }
  }

  function stopVoice() {
    if (!recording) return;
    recording = false;
    voiceBtn.classList.remove('active');
    voiceBtn.textContent = '🎙️';
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop_session' }));
      setTimeout(() => {
        try { ws.close(); } catch (e) {}
      }, 500);
    }
    cleanupAudio();
    setStatus('', 'Disconnected');
  }

  function cleanupAudio() {
    if (proc) { proc.disconnect(); proc = null; }
    if (srcNode) { srcNode.disconnect(); srcNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (ac) { ac.close().catch(() => {}); ac = null; }
  }

  function playPCM16Hex(h) {
    try {
      const bytes = new Uint8Array(h.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      const samples = bytes.length / 2;
      const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx2.createBuffer(1, samples, ctx2.sampleRate);
      const ch = buf.getChannelData(0);
      const dv = new DataView(bytes.buffer);
      for (let i = 0; i < samples; i++) {
        const v = dv.getInt16(i * 2, true);
        ch[i] = v / 0x8000;
      }
      const s = ctx2.createBufferSource();
      s.buffer = buf;
      s.connect(ctx2.destination);
      s.start();
    } catch (e) {}
  }

  window.addEventListener('beforeunload', () => {
    try { stopVoice(); } catch (e) {}
  });
  </script>
</body>
</html>
